# 构建 Windows 安装包（Velopack，单个 Setup.exe）并附加到 GitHub Release。两种：
# - LightTextEditor-win-Setup.exe：自带 .NET 运行时，不需要另装任何东西（约 75 MB）
# - LightTextEditor-win-slim-Setup.exe：不含 .NET（约 40 MB）；电脑上没有 .NET 10 桌面运行时时，
#   安装程序会自动下载安装（需要联网，可能请求管理员权限）
#
# 触发方式（只由“新标签”触发，每个版本只构建一次）：
# - 推送版本标签（v1.2.3 或 1.2.3，可带预发布后缀如 v1.2.3-beta.1）：构建后附加到该标签的 Release；
#   还没有 Release 时自动创建一个草稿（Draft），检查后手动发布（发布时不会再构建）。
# - 在 GitHub 上发布 Release 并新建标签（Draft a new release → 填写新标签 → Publish）：发布时 GitHub 创建标签，
#   同样由上面的标签触发，构建后附加到这个 Release。不另外监听“Release 已发布”事件：
#   那样新建标签和发布 Release 会各触发一次，同一个版本构建两遍。
#   GitHub 不会为“保存为草稿”触发工作流（标签在发布时才创建）。
# - 手动运行（Actions → 构建安装包 → Run workflow）：填写已有的标签时，构建该标签并附加到它的 Release
#   （例如为旧标签补上安装包、重新构建）；不填时只构建，不上传。
# - 修改本文件的 Pull Request：只构建，不上传。
# 只构建的运行，安装包可以在运行结果的 Artifacts 中下载。
name: 构建安装包

on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: '已有的版本标签（如 v1.2.3）：构建并附加到它的 Release。不填则只构建、不上传'
        required: false
        default: ''

permissions:
  contents: write

# 同一个标签（或分支）同时只运行一次，新的运行取消旧的
concurrency:
  group: installer-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VPK_VERSION: 1.2.161 # 与 src/LightTextEditor.App 引用的 Velopack 版本保持一致
  PACK_ID: LightTextEditor

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: 运行测试
        run: dotnet test -c Release

  installer:
    name: Windows 安装包
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: 确定版本号
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          case "$EVENT" in
            push) tag="$REF_NAME" ;;
            workflow_dispatch) tag="$INPUT_TAG" ; version="0.0.1-manual" ;;
            *) tag="" ; version="0.0.1-ci.$RUN_NUMBER" ;;
          esac
          if [ -n "$tag" ]; then version="${tag#[vV]}"; fi
          # Velopack 要求语义化版本：主.次.修订，可带 -预发布 / +构建 后缀
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号“$version”不是 主.次.修订 格式（例如 v1.2.3 或 v1.2.3-beta.1）"
            exit 1
          fi
          if [[ "$version" =~ ^0\.0\.0([-+]|$) ]]; then
            echo "::error::版本号至少是 0.0.1（Velopack 不接受 0.0.0）"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "标签：${tag:-（无，只构建）}  版本：$version"

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: 发布（预编译；自带运行时版和不含运行时版）
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish src/LightTextEditor.App -c Release -r win-x64 --self-contained true \
            -p:Version="$VERSION" -o publish/full
          dotnet publish src/LightTextEditor.App -c Release -r win-x64 --self-contained false \
            -p:Version="$VERSION" -o publish/slim

      - name: 打包（Velopack）
        env:
          VERSION: ${{ steps.version.outputs.version }}
          AUTHORS: ${{ github.repository_owner }}
        run: |
          dotnet tool install vpk --version "$VPK_VERSION" --tool-path .tools
          common=(--packId "$PACK_ID" --packVersion "$VERSION" --runtime win-x64
                  --mainExe LightTextEditor.exe --packTitle LightTextEditor --packAuthors "$AUTHORS"
                  --icon src/LightTextEditor.App/Assets/app.ico --outputDir Releases)
          # 自带 .NET：渠道 win → LightTextEditor-win-Setup.exe
          ./.tools/vpk pack "${common[@]}" --channel win --packDir publish/full
          # 不含 .NET：渠道 win-slim → LightTextEditor-win-slim-Setup.exe，安装时缺少运行时就自动安装
          ./.tools/vpk pack "${common[@]}" --channel win-slim --packDir publish/slim \
            --framework net10.0-x64-desktop
          ls -la Releases

      - name: 上传到运行结果（Artifacts）
        uses: actions/upload-artifact@v6
        with:
          name: LightTextEditor-${{ steps.version.outputs.version }}-win
          path: Releases/*
          if-no-files-found: error

      - name: 附加到 GitHub Release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # 只推送了标签：创建草稿，检查后手动发布
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "LightTextEditor $TAG" --generate-notes
          fi
          # 两个 *-Setup.exe 是单文件安装包；其余文件（便携版、更新包与索引，按渠道分开）供以后的自动更新使用
          gh release upload "$TAG" Releases/* --repo "$GITHUB_REPOSITORY" --clobber
