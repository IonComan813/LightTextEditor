<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 示例</title>
  <!--
    这份示例演示 HTML 文件的语法高亮：标签、属性、内嵌的 CSS 和 JavaScript 都有各自的配色。
    想看网页效果，可以用菜单“查看 → 在浏览器中打开”。
    这份示例可以随意修改或删除，需要时从“帮助 → HTML 示例”重新打开一份。
  -->
  <style>
    :root {
      --accent: #2f6fed;
      --muted: #6b7280;
    }

    body {
      max-width: 760px;
      margin: 40px auto;
      padding: 0 16px;
      font-family: "Microsoft YaHei UI", "PingFang SC", sans-serif;
      line-height: 1.7;
      color: #1f2328;
    }

    h1 { border-bottom: 2px solid var(--accent); padding-bottom: 6px; }
    .note { color: var(--muted); font-size: 0.9em; }

    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #d0d7de; padding: 6px 10px; text-align: left; }
    th { background: #f6f8fa; }

    button {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    button:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <header>
    <h1>HTML 示例</h1>
    <p class="note">用 LightTextEditor 编辑，用浏览器查看效果。</p>
  </header>

  <main>
    <section id="text">
      <h2>文字格式</h2>
      <p>
        <strong>加粗</strong>、<em>斜体</em>、<u>下划线</u>、<s>删除线</s>、
        <mark>高亮</mark>、<code>行内代码</code>、H<sub>2</sub>O、x<sup>2</sup>。
      </p>
      <p>链接：<a href="https://avaloniaui.net/" target="_blank">Avalonia 官网</a></p>
      <blockquote>引用：好记性不如烂笔头。</blockquote>
    </section>

    <section id="lists">
      <h2>列表</h2>
      <ul>
        <li>无序列表</li>
        <li>第二项
          <ol>
            <li>嵌套的有序列表</li>
            <li>第二步</li>
          </ol>
        </li>
      </ul>
    </section>

    <section id="table">
      <h2>表格</h2>
      <table>
        <thead>
          <tr><th>快捷键</th><th>功能</th></tr>
        </thead>
        <tbody>
          <tr><td>Ctrl+S</td><td>保存</td></tr>
          <tr><td>Ctrl+E</td><td>Markdown 预览</td></tr>
          <tr><td>Ctrl+F</td><td>查找</td></tr>
        </tbody>
      </table>
    </section>

    <section id="image">
      <h2>图片</h2>
      <!-- 相对路径：图片在笔记库的 assets 文件夹里 -->
      <img src="assets/示例图片.png" alt="示例图片" width="320">
    </section>

    <section id="form">
      <h2>表单与脚本</h2>
      <label for="name">名字：</label>
      <input id="name" type="text" placeholder="输入你的名字">
      <button type="button" id="greet">打招呼</button>
      <p id="output" class="note"></p>
    </section>
  </main>

  <footer class="note">
    &copy; 2026 LightTextEditor 示例 &middot; 字符实体：&lt;div&gt; &amp; &quot;引号&quot;
  </footer>

  <script>
    // 点击按钮时显示问候语
    const button = document.getElementById("greet");
    button.addEventListener("click", () => {
      const name = document.getElementById("name").value.trim() || "朋友";
      const hour = new Date().getHours();
      const greeting = hour < 12 ? "早上好" : hour < 18 ? "下午好" : "晚上好";
      document.getElementById("output").textContent = `${greeting}，${name}！`;
    });
  </script>
</body>
</html>
